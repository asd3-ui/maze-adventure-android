name: Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "assets/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "assets/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/index.tsx
            app/_layout.tsx
            app/components/types.ts
            app/components/maze-utils.ts
            app/components/MazeBoard.tsx
            app/components/LevelSelector.tsx
            app/components/StartScreen.tsx
            app/components/SettingsScreen.tsx
            app/components/ResultScreen.tsx
            assets/
            app.json
            eas.json
            package.json
            package-lock.json
            tsconfig.json
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependencies
        run: npx expo install --check
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          rm -rf "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          for attempt in 1 2 3; do
            echo "Installing Android NDK ${NDK_VERSION} (attempt ${attempt}/3)"
            if "${SDKMANAGER}" --install "ndk;${NDK_VERSION}"; then
              break
            fi
            rm -rf "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
            if [ "${attempt}" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maze-adventure-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
